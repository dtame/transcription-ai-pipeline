[pytest]
# La suite de tests vit exclusivement dans app/tests.
#
# Sans ce périmètre, pytest collecte aussi les scripts de démonstration restés
# à la racine (test_ai.py, test_semantic_cleaner.py). Ceux-ci n'exposent aucun
# test : ce sont des scripts du prototype book/ qui appellent RÉELLEMENT Ollama
# dès leur import, donc pendant la phase de collecte. Un `pytest` lancé sur une
# machine où Ollama tourne déclenchait ainsi une vraie inférence LLM, et
# échouait sur une machine hors ligne.
#
# Restreindre la collecte ne retire aucun test (756 avant comme après) et rend
# la suite hermétique : ni réseau, ni LLM, ni service local requis.
# Les scripts de la racine restent exécutables à la main, inchangés.
testpaths = app/tests
